<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Glowing Crimson Circle Shadow -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- OLED Pitch Black Background -->
  <rect width="100" height="100" rx="28" fill="#000000" />

  <!-- Outer Concentric Fine Circle -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Dot Matrix Concentric Inner Circle -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="1 3" />

  <!-- Nothing OS Signature Accent: Glowing Solid Red Dot -->
  <circle cx="50" cy="50" r="8" fill="#FF2D2D" filter="url(#crimsonGlow)" />
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />

  <!-- Orbiting Satellites (Nothing styling dots) -->
  <circle cx="50" cy="20" r="2.5" fill="#E50914" />
  <circle cx="50" cy="80" r="2" fill="rgba(255, 255, 255, 0.3)" />
  <circle cx="20" cy="50" r="2" fill="rgba(255, 255, 255, 0.3)" />
  <circle cx="80" cy="50" r="2.5" fill="rgba(255, 255, 255, 0.3)" />
</svg>
