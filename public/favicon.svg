<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Accent Red Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#FF2D2D" />
    </linearGradient>
    <!-- Soft Red Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer OLED Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#0F0F0F" stroke-width="6" />
  
  <!-- Premium Accent Ring with Glow -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#flameGrad)" stroke-width="2.5" filter="url(#glow)" stroke-dasharray="210 60" stroke-linecap="round" />
  
  <!-- Minimal Central Energy Flame Symbol -->
  <path d="M50 28 C56 36, 61 41, 61 49 C61 56, 55 61, 50 61 C45 61, 39 56, 39 49 C39 42, 44 36, 50 28 Z" fill="url(#flameGrad)" />
  <path d="M50 36 C53 41, 56 44, 56 49 C56 53, 53 56, 50 56 C47 56, 44 53, 44 49 C44 44, 47 41, 50 36 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
